<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>History — HEIMDALL</title>
<link rel="icon" href="../logo.png" />
<link rel="stylesheet" href="mobile-style.css" />
<link rel="stylesheet" href="mobile-pages.css" />
<link rel="stylesheet" href="mobile-fixes.css" />
</head>
<body data-page="history">

  <div class="mx-bg"></div>
  <div class="mx-bg-grain"></div>
  <div class="mx-stars"></div>

  <div class="mx-app">

    <header class="mx-header">
      <div class="mx-brand">
        <img src="../logo.png" alt="HEIMDALL" class="mx-logo" />
        <div class="mx-brand-text">
          <span class="mx-brand-title">HEIMDALL</span>
          <span class="mx-brand-page">History</span>
        </div>
      </div>
      <div class="mx-header-status">
        <span class="mx-status-dot"></span>
        <span>ONLINE</span>
      </div>
    </header>

    <main class="mx-main mx-history-main">
      <div class="mx-search-field">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="history-search" type="text" placeholder="Search conversations..." />
      </div>

      <div class="mx-history-list" id="history-list"></div>
    </main>

    <nav class="mx-tabbar">
      <a class="mx-tab" data-tab="home" href="index.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V20H14V14H10V20H4V11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="mx-tab-label">Home</span>
      </a>
      <a class="mx-tab" data-tab="chat" href="chat.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span class="mx-tab-label">Chat</span>
      </a>
      <a class="mx-tab" data-tab="history" href="history.html">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12L15 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="mx-tab-label">History</span>
      </a>
      <a class="mx-tab" data-tab="capabilities" href="capabilities.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3L14.5 9.5L21 12L14.5 14.5L12 21L9.5 14.5L3 12L9.5 9.5L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="mx-tab-label">Capabilities</span>
      </a>
      <a class="mx-tab" data-tab="settings" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7H20M4 17H20M8 7V3M8 21V17M16 7V3M16 21V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="7" r="2" fill="currentColor"/><circle cx="16" cy="17" r="2" fill="currentColor"/></svg>
        <span class="mx-tab-label">Settings</span>
      </a>
    </nav>

  </div>

<script src="../main.js"></script>
<script src="mobile-main.js"></script>
<script src="mobile-history.js"></script>
</body>
</html>
