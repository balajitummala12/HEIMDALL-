<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat — HEIMDALL</title>

    <!-- All files are in the same folder -->
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
</head>

<body data-page="chat">

    <!-- Animated Background -->
    <div id="heimdall-bg"></div>

    <div class="app-shell">

        <!-- =========================
             NAVIGATION
        ========================== -->
        <nav class="hx-nav">

            <!-- Clean URL: Home -->
            <a href="/"
               class="hx-logo-link"
               aria-label="HEIMDALL home">

                <img
                    src="logo.png"
                    alt="HEIMDALL Logo"
                    class="hx-logo"
                >

            </a>

            <ul class="hx-navlinks">

                <li>
                    <a href="/" data-nav="home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="/chat" data-nav="chat">
                        Chat
                    </a>
                </li>

                <li>
                    <a href="/history" data-nav="history">
                        History
                    </a>
                </li>

                <li>
                    <a href="/capabilities" data-nav="capabilities">
                        Capabilities
                    </a>
                </li>

                <li>
                    <a href="/settings" data-nav="settings">
                        Settings
                    </a>
                </li>

            </ul>

            <div class="hx-nav-right">
                <span class="hx-nav-tag">
                    CORE v2.1
                </span>
            </div>

        </nav>


        <!-- =========================
             CHAT LAYOUT
        ========================== -->
        <div class="page-body chat-layout">


            <!-- =========================
                 LEFT SIDEBAR
            ========================== -->
            <aside class="chat-sidebar">

                <button
                    class="hx-btn new-chat-btn"
                    id="new-chat-btn"
                    type="button"
                >

                    <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <path
                            d="M12 5v14M5 12h14"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>

                    New conversation

                </button>


                <!-- Search -->
                <div class="search-field">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                        <path
                            d="M20 20L16.5 16.5"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />
                    </svg>

                    <input
                        id="sidebar-search"
                        type="text"
                        placeholder="Search conversations..."
                        autocomplete="off"
                    >

                </div>


                <div class="chat-sidebar-title">
                    Recent History
                </div>


                <!-- Conversations -->
                <div
                    class="conv-list"
                    id="conv-list"
                ></div>

            </aside>


            <!-- =========================
                 MAIN CHAT AREA
            ========================== -->
            <section class="chat-main">


                <!-- Messages -->
                <div
                    class="chat-scroll"
                    id="chat-scroll"
                >

                    <div
                        class="chat-empty"
                        id="chat-empty"
                    >

                        <h3>No conversation selected</h3>

                        <p>
                            Start a new conversation or pick one from
                            Recent History.
                        </p>

                    </div>

                </div>


                <!-- =========================
                     CHAT INPUT
                ========================== -->
                <div class="chat-input-bar">

                    <form
                        id="chat-form"
                        class="chat-input-shell"
                        autocomplete="off"
                    >

                        <input
                            id="chat-input"
                            type="text"
                            name="message"
                            placeholder="Command HEIMDALL..."
                            aria-label="Message HEIMDALL"
                            autocomplete="off"
                        >

                        <button
                            type="submit"
                            class="send-btn"
                            aria-label="Send message"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                            >
                                <path
                                    d="M4 12L20 4L14 20L11 13L4 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linejoin="round"
                                    stroke-linecap="round"
                                />
                            </svg>

                        </button>

                    </form>

                </div>

            </section>

        </div>


        <!-- =========================
             SYSTEM STATUS
        ========================== -->
        <div class="hx-status">

            <span class="hx-status-dot"></span>

            <span class="hx-status-text">
                SYSTEM ONLINE
            </span>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="background.js"></script>
    <script src="main.js"></script>
    <script src="chat.js"></script>

  <script src="device-router.js"></script>
</body>
</html>
